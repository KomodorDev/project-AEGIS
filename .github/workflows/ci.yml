name: Delivery baseline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  format:
    name: clang-format 18
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned build tools
        run: python -m pip install -r tools/requirements.txt
      - name: Configure formatting target
        run: cmake --preset format
      - name: Check formatting
        run: cmake --build --preset format --target format-check

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 / GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Ubuntu 24.04 / Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS 15 / AppleClang
            os: macos-15
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Configure, build, and test
        run: cmake --workflow --preset verify

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer + UndefinedBehaviorSanitizer
            workflow: verify-asan-ubsan
          - name: ThreadSanitizer
            workflow: verify-tsan
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.workflow }}

  benchmark-smoke:
    name: Benchmark harness smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Build the release profile
        run: cmake --workflow --preset benchmark
      - name: Run the benchmark harness
        run: python tools/run_benchmarks.py
      - name: Upload machine-readable benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m0-benchmark-${{ github.sha }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 90
