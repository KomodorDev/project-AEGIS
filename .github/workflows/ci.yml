# Purpose: Build and inspect the implemented M0-M2 baseline on every supported compiler, run
# sanitizer checks, and retain machine-readable benchmark smoke results.
name: Delivery baseline

# Run for changes entering the integration branch and allow an operator to run
# the same checks manually. An empty `workflow_dispatch` mapping is the GitHub
# Actions syntax for enabling the "Run workflow" button with no extra inputs.
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

# Grant every job only read access to repository contents. Jobs in this
# workflow do not need permission to modify code, issues, or pull requests.
permissions:
  contents: read

# `${{ ... }}` is a GitHub Actions expression. Combining the workflow name and
# git reference creates one concurrency group per branch or pull request; a new
# run replaces an obsolete run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This environment variable applies to every job and keeps pip output focused
# by suppressing its unrelated upgrade notice.
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Formatting is a separate fast gate so style failures are easy to identify.
  format:
    name: clang-format 18
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned by immutable commit SHA. The trailing
      # version comment is for humans; GitHub executes the exact SHA.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave a writable GitHub token in the local git configuration.
          persist-credentials: false
      # Python supplies the repository's pinned CMake, Ninja, clang-format, and
      # Ruff tools; it is development tooling rather than an AEGIS dependency.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Install every exact tool version listed in the shared requirements file.
      - name: Install pinned build tools
        run: python -m pip install -r tools/requirements.txt
      # Configure first, then invoke the generated check-only formatting target.
      - name: Configure formatting target
        run: cmake --preset format
      - name: Check formatting
        run: cmake --build --preset format --target format-check

  # Compile and test once for every supported compiler family and host platform.
  build-test:
    # Matrix fields are addressed with `${{ matrix.field }}` and are substituted
    # separately for each expanded job below.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Report all platform results even if one matrix entry fails early.
      fail-fast: false
      # `include` defines complete, readable configurations instead of producing
      # every possible cross-product of operating system and compiler values.
      matrix:
        include:
          - name: Ubuntu 24.04 / GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Ubuntu 24.04 / Clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS 15 / AppleClang
            os: macos-15
            cc: clang
            cxx: clang++
    # CMake reads CXX during its first configure to select this C++-only
    # project's compiler. CC is paired with it as the conventional toolchain
    # environment, ready for any later target that enables the C language.
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # Fetch the exact revision under test without persisting write credentials.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Use one Python version consistently across all build hosts.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Pin the build front end and generator so host package updates cannot
      # silently change CI behavior.
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      # A workflow preset performs configure, compile, and CTest in one command.
      - name: Configure, build, and test
        run: cmake --workflow --preset verify

  # Re-run the test suite under runtime instrumentation that catches memory,
  # undefined-behavior, and data-race defects ordinary tests may miss.
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # The sanitizer modes are independent, so run both even if one fails.
      fail-fast: false
      # AddressSanitizer cannot be combined with ThreadSanitizer; separate matrix
      # entries select the matching CMake workflow preset for each mode.
      matrix:
        include:
          - name: AddressSanitizer + UndefinedBehaviorSanitizer
            workflow: verify-asan-ubsan
          - name: ThreadSanitizer
            workflow: verify-tsan
    # Ask every sanitizer to fail immediately. Clang is selected explicitly
    # because these sanitizer profiles are qualified with the Clang runtime.
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      # Fetch the source without retaining GitHub write credentials.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Python provides the pinned build tooling on the clean hosted runner.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Keep sanitizer builds on the same CMake and Ninja versions as normal CI.
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      # The selected matrix value becomes either `verify-asan-ubsan` or
      # `verify-tsan`, so each run configures the appropriate instrumentation.
      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.workflow }}

  # Prove that the release benchmark executable and both evidence collectors work.
  # Hosted-runner timings are smoke evidence, not performance qualifications.
  benchmark-smoke:
    name: M0 and M2 benchmark smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Use Clang consistently for the retained benchmark context record.
    env:
      CC: clang
      CXX: clang++
    steps:
      # Fetch the measured revision without persisting write credentials.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Python runs the pinned tools and benchmark evidence wrapper.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # Match the build tool versions used by the compile and sanitizer jobs.
      - name: Install pinned CMake and Ninja
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      # Build and test the optimized profile before collecting timing output.
      - name: Build the release profile
        run: cmake --workflow --preset benchmark
      # Produce isolated M0 and M2 raw JSON plus one complete environment manifest per suite.
      - name: Run the benchmark workloads
        run: |
          python tools/run_benchmarks.py --suite m0
          python tools/run_benchmarks.py --suite m2
      # Reject missing fields, mismatched hashes, stale provenance, wrong workload records, or a
      # non-Release producer before an artifact can be mistaken for valid evidence.
      - name: Validate the benchmark evidence
        run: |
          python tools/validate_benchmark_evidence.py --suite m0
          python tools/validate_benchmark_evidence.py --suite m2
      # Preserve every generated JSON file for 90 days. The `*.json` glob
      # selects both result files, while `if-no-files-found: error` prevents a
      # falsely successful run that uploaded no evidence.
      - name: Upload machine-readable benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Include the immutable commit SHA so artifacts from concurrent runs
          # are distinguishable without opening them.
          name: m0-m2-benchmarks-${{ github.sha }}
          path: benchmark-results/*.json
          if-no-files-found: error
          retention-days: 90
